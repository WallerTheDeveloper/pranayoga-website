# Staging site on the DigitalOcean droplet, behind one shared login (docs/DEPLOY.md).
# Install as /etc/nginx/sites-available/pranayoga-staging, link it into sites-enabled, then run
# `sudo nginx -t` before every reload: the droplet's other sites share this nginx.
# `certbot --nginx -d pranayoga.pickmajob.cc` then adds HTTPS and the http→https redirect.
#
# Replace 3100 if APP_PORT in /home/pranayoga/app/.env differs.

server {
    listen 80;
    listen [::]:80;
    server_name pranayoga.pickmajob.cc;

    # Payload accepts uploads up to 15 MB; nginx's default would stop them at 1 MB.
    client_max_body_size 16m;

    # Never indexed, whatever the app says ("always" also covers error pages). nginx drops
    # server-level add_header lines in any location that has its own add_header, so a location
    # below that adds a header must repeat this one.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # While the app restarts (deploys, rollbacks) its port is closed: a short note instead of
    # nginx's bare 502 page.
    error_page 502 504 = @starting;
    location @starting {
        default_type "text/plain; charset=utf-8";
        return 503 "Die Vorschau wird gerade aktualisiert. Bitte in einer Minute neu laden.\n";
    }

    # The cache refresh is only for the container's own start script.
    location ^~ /next/refresh {
        return 404;
    }

    # The login sits on this location, not the whole server, so certbot's challenge requests
    # (its own /.well-known/acme-challenge/ locations) pass without it, also at renewals.
    location / {
        auth_basic "Pranayoga Vorschau";
        auth_basic_user_file /etc/nginx/pranayoga-staging.htpasswd;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The shared login's credentials end here; the app has its own login.
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}
